<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Skalette Bistro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .feedback-container {
            min-height: 100vh;
            background: var(--navy-dark);
            padding: 100px 20px 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .feedback-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(201, 169, 97, 0.2);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        .feedback-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .feedback-header h1 {
            font-family: var(--font-display);
            color: var(--gold);
            font-size: 32px;
            margin-bottom: 10px;
        }
        .star-rating {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
        }
        .star {
            font-size: 40px;
            color: var(--grey);
            cursor: pointer;
            transition: all 0.2s;
        }
        .star:hover,
        .star.active {
            color: #fbbc04;
            transform: scale(1.1);
        }
        .feedback-form {
            margin-top: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: var(--grey-light);
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-group textarea {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--white);
            font-family: var(--font-body);
            font-size: 14px;
            min-height: 120px;
            resize: vertical;
        }
        .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--gold);
            color: var(--navy-dark);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
        }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .success-message {
            text-align: center;
            padding: 40px;
        }
        .success-message h2 {
            color: var(--gold);
            margin-bottom: 15px;
        }
        .success-message p {
            color: var(--grey-light);
        }
    </style>
</head>
<body>
    <div class="feedback-container">
        <div class="feedback-card">
            <div id="feedback-form">
                <div class="feedback-header">
                    <h1>La Tua Opinione</h1>
                    <p style="color: var(--grey-light);">Come è stata la tua esperienza?</p>
                </div>
                
                <div class="star-rating" id="star-rating">
                    <span class="star" data-rating="1">☆</span>
                    <span class="star" data-rating="2">☆</span>
                    <span class="star" data-rating="3">☆</span>
                    <span class="star" data-rating="4">☆</span>
                    <span class="star" data-rating="5">☆</span>
                </div>
                
                <div class="feedback-form">
                    <form id="feedback-form-element">
                        <div class="form-group">
                            <label>Raccontaci la tua esperienza (opzionale)</label>
                            <textarea id="feedback-text" placeholder="Cosa ti è piaciuto di più? Cosa possiamo migliorare?"></textarea>
                        </div>
                        <button type="submit" class="submit-btn" id="submit-btn">Invia Feedback</button>
                    </form>
                </div>
            </div>
            
            <div id="success-message" style="display: none;" class="success-message">
                <h2>✅ Grazie!</h2>
                <p>Il tuo feedback è stato inviato con successo.</p>
                <p style="margin-top: 20px; font-size: 14px;">Apprezziamo molto la tua opinione!</p>
            </div>
        </div>
    </div>

    <script type="module">
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const reservationId = urlParams.get('id');
        const token = urlParams.get('token');
        
        let selectedRating = 0;
        
        // Star rating interaction
        const stars = document.querySelectorAll('.star');
        stars.forEach(star => {
            star.addEventListener('click', () => {
                const rating = parseInt(star.dataset.rating);
                selectedRating = rating;
                
                stars.forEach((s, index) => {
                    if (index < rating) {
                        s.textContent = '★';
                        s.classList.add('active');
                    } else {
                        s.textContent = '☆';
                        s.classList.remove('active');
                    }
                });
            });
            
            star.addEventListener('mouseenter', () => {
                const rating = parseInt(star.dataset.rating);
                stars.forEach((s, index) => {
                    if (index < rating) {
                        s.style.color = '#fbbc04';
                    }
                });
            });
            
            star.addEventListener('mouseleave', () => {
                stars.forEach((s, index) => {
                    if (index >= selectedRating) {
                        s.style.color = 'var(--grey)';
                    }
                });
            });
        });
        
        // Form submission
        document.getElementById('feedback-form-element').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (selectedRating === 0) {
                alert('Per favore seleziona una valutazione');
                return;
            }
            
            const feedbackText = document.getElementById('feedback-text').value;
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Invio in corso...';
            
            try {
                // Save feedback to Firebase
                const feedbackData = {
                    reservationId: reservationId,
                    rating: selectedRating,
                    comment: feedbackText,
                    submittedAt: new Date().toISOString()
                };
                
                // Save to Firebase (create a feedbacks collection)
                const PROJECT_ID = 'skalette-bistro';
                const API_KEY = 'AIzaSyAbTQnt26Gca0sPa1RlhIyq2TIwLfKfl0s';
                
                const url = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/feedbacks?key=${API_KEY}`;
                
                const firestoreData = {
                    fields: {
                        reservationId: { stringValue: reservationId || '' },
                        rating: { integerValue: selectedRating },
                        comment: { stringValue: feedbackText || '' },
                        submittedAt: { stringValue: feedbackData.submittedAt }
                    }
                };
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(firestoreData)
                });
                
                if (response.ok) {
                    // Show success
                    document.getElementById('feedback-form').style.display = 'none';
                    document.getElementById('success-message').style.display = 'block';
                } else {
                    throw new Error('Errore nel salvataggio');
                }
            } catch (error) {
                console.error('Error submitting feedback:', error);
                alert('Errore nell\'invio del feedback. Riprova.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Invia Feedback';
            }
        });
    </script>
</body>
</html>
